<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test ADIF - Cuadro Intermedio</title>
    <style>
        :root { --primary: #005f73; --secondary: #0a9396; --bg: #f8f9fa; --text: #212529; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 15px; }
        h1 { color: var(--primary); font-size: 1.4rem; text-align: center; }
        input, select, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 1rem; box-sizing: border-box; }
        button { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: var(--secondary); }
        .option-btn { background: #e9ecef; color: var(--text); text-align: left; font-weight: normal; margin: 5px 0; }
        .correct { background: #d4edda !important; color: #155724; border-color: #c3e6cb; }
        .incorrect { background: #f8d7da !important; color: #721c24; border-color: #f5c6cb; }
        .explanation { background: #e2e3e5; padding: 10px; border-radius: 6px; font-size: 0.9rem; margin-top: 10px; display: none; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="card" id="config-card">
        <h1>Prep. ADIF - Cuadro Intermedio</h1>
        <label><b>Pega tu Clave API de Gemini:</b></label>
        <input type="password" id="apiKey" placeholder="AIzaSy...">
        
        <label><b>Selecciona Bloque del Temario:</b></label>
        <select id="topic">
            <option value="Estatuto de la entidad pública empresarial ADIF">Estatuto de ADIF</option>
            <option value="Ley 38/2015 del Sector Ferroviario">Ley del Sector Ferroviario</option>
            <option value="Estatuto de los Trabajadores y Convenio colectivo de ADIF">Estatuto / Convenio ADIF</option>
            <option value="Prevención de Riesgos Laborales en ADIF">Prevención de Riesgos (PRL)</option>
        </select>

        <button onclick="generarTest()">Generar Pregunta</button>
    </div>

    <div id="loading" class="card hidden" style="text-align: center;">
        ⏳ Generando pregunta tipo test según normativa de ADIF...
    </div>

    <div class="card hidden" id="quiz-card">
        <h3 id="question-text"></h3>
        <div id="options-container"></div>
        <div id="explanation-box" class="explanation"></div>
        <button id="next-btn" class="hidden" onclick="generarTest()">Siguiente Pregunta ➡️</button>
    </div>

    <script>
        document.getElementById('apiKey').value = localStorage.getItem('adif_api_key') || '';

        async function generarTest() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const topic = document.getElementById('topic').value;

            if (!apiKey) {
                alert("Por favor, introduce tu clave de API.");
                return;
            }

            localStorage.setItem('adif_api_key', apiKey);
            document.getElementById('config-card').classList.add('hidden');
            document.getElementById('quiz-card').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            const prompt = `Genera 1 pregunta tipo test oficial para oposiciones de Cuadro Intermedio de ADIF sobre: "${topic}".
            Responde EXCLUSIVAMENTE con este formato JSON:
            {
              "pregunta": "Enunciado aquí",
              "opciones": ["A) Opción 1", "B) Opción 2", "C) Opción 3", "D) Opción 4"],
              "correcta": 0,
              "explicacion": "Artículo o norma legal que lo justifica."
            }`;

            try {
                // Modelo actualizado a gemini-2.5-flash
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || "Error HTTP " + response.status);
                }

                const data = await response.json();
                const rawText = data.candidates[0].content.parts[0].text;
                const cleanJson = rawText.replace(/```json|```/g, '').trim();
                const quizData = JSON.parse(cleanJson);

                mostrarPregunta(quizData);
            } catch (error) {
                alert("Detalle del error: " + error.message);
                document.getElementById('config-card').classList.remove('hidden');
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function mostrarPregunta(data) {
            document.getElementById('quiz-card').classList.remove('hidden');
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('question-text').innerText = data.pregunta;

            const container = document.getElementById('options-container');
            container.innerHTML = '';

            const expBox = document.getElementById('explanation-box');
            expBox.style.display = 'none';
            expBox.innerText = `💡 Justificación: ${data.explicacion}`;

            data.opciones.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => verificarRespuesta(index, data.correcta, btn);
                container.appendChild(btn);
            });
        }

        function verificarRespuesta(seleccionada, correcta, btnSeleccionado) {
            const btns = document.querySelectorAll('.option-btn');
            btns.forEach(b => b.disabled = true);

            if (seleccionada === correcta) {
                btnSeleccionado.classList.add('correct');
            } else {
                btnSeleccionado.classList.add('incorrect');
                btns[correcta].classList.add('correct');
            }

            document.getElementById('explanation-box').style.display = 'block';
            document.getElementById('next-btn').classList.remove('hidden');
        }
    </script>
</body>
</html>
